[package]
name = "fedbox"
version = "0.1.0"
edition = "2021"

[dependencies]
console = "0.15"
dialoguer = "0.11"
serde = { version = "1.0", features = ["derive"] }
config = "0.13"
clap = { version = "4.0", features = ["derive"] }
term = "0.7"
atty = "0.2"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3